info:
  name: SleepLogs
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: graphql
    data:
      query: |
        query SleepLogs {
          sleepLogs(page: 1, limit: 30) {
            sleepLogs { id sleepDate durationHours quality moodOnWaking }
            total
          }
        }

settings:
  encodeUrl: true
