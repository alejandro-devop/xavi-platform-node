info:
  name: ActivityCategoryAdd
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: graphql
    data:
      query: |
        mutation ActivityCategoryAdd($input: ActivityCategoryInput!) {
          activityCategoryAdd(input: $input) {
            id
            name
            icon
            color
          }
        }
      variables: |
        {
          "input": {
            "name": "Work",
            "icon": "briefcase",
            "color": "#2196F3"
          }
        }

settings:
  encodeUrl: true
