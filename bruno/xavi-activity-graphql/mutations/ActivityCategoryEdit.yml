info:
  name: ActivityCategoryEdit
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: graphql
    data:
      query: |
        mutation ActivityCategoryEdit($input: ActivityCategoryEditInput!) {
          activityCategoryEdit(input: $input) {
            id
            name
            color
          }
        }
      variables: |
        {
          "input": {
            "id": "CATEGORY_UUID",
            "name": "Work (updated)"
          }
        }

settings:
  encodeUrl: true
