info:
  name: ActivityFollowUpEdit
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: graphql
    data:
      query: |
        mutation ActivityFollowUpEdit($input: ActivityFollowUpEditInput!) {
          activityFollowUpEdit(input: $input) {
            id
            durationMinutes
            endTime
            endDateTime
          }
        }
      variables: |
        {
          "input": {
            "id": "1",
            "durationMinutes": 120
          }
        }

settings:
  encodeUrl: true
