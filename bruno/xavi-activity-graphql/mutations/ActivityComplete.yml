info:
  name: ActivityComplete
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: graphql
    data:
      query: |
        mutation ActivityComplete($id: ID!) {
          activityComplete(id: $id) {
            id
            status
            completedAt
          }
        }
      variables: |
        { "id": "1" }

settings:
  encodeUrl: true
