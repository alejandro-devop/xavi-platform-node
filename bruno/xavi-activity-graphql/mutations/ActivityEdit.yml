info:
  name: ActivityEdit
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: graphql
    data:
      query: |
        mutation ActivityEdit($input: ActivityEditInput!) {
          activityEdit(input: $input) {
            id
            title
            categoryId
          }
        }
      variables: |
        {
          "input": {
            "id": "1",
            "title": "Deep work (updated)"
          }
        }

settings:
  encodeUrl: true
