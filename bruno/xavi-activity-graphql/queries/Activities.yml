info:
  name: Activities
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: graphql
    data:
      query: |
        query Activities($status: ActivityStatus, $categoryId: ID) {
          activities(status: $status, categoryId: $categoryId, limit: 20) {
            activities {
              id
              title
              status
              priority
              categoryId
              category { id name color }
              spentTimeMinutes
            }
            total
          }
        }

settings:
  encodeUrl: true
