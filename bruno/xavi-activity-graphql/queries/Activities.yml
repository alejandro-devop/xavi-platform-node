info:
  name: Activities
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: graphql
    data:
      query: |
        query Activities {
          activities(status: pending, limit: 20) {
            activities { id title status priority scheduledDate }
            total
          }
        }

settings:
  encodeUrl: true
