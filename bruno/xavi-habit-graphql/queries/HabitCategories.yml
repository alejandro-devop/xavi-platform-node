info:
  name: HabitCategories
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: graphql
    data:
      query: |
        query HabitCategories {
          habitCategories {
            id
            name
            icon
            color
            orderIndex
          }
        }

settings:
  encodeUrl: true
