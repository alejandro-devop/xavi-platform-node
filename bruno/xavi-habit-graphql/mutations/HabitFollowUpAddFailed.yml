info:
  name: HabitFollowUpAdd (failed streak reset)
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: graphql
    data:
      query: |
        mutation HabitFollowUpAdd($input: HabitFollowUpAddInput!) {
          habitFollowUpAdd(input: $input) {
            id
            isFailed
            habit {
              streak
              endDate
            }
          }
        }
      variables: |
        {
          "input": {
            "habitId": "1",
            "date": "2026-05-19",
            "isFailed": true
          }
        }

settings:
  encodeUrl: true
