info:
  name: LearningProgressAdd
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: graphql
    data:
      query: |
        mutation LearningProgressAdd($input: LearningProgressInput!) {
          learningProgressAdd(input: $input) {
            id
            resourceId
            durationMinutes
            progressPercentage
          }
        }
      variables: |
        {
          "input": {
            "resourceId": "12",
            "durationMinutes": 45,
            "progressPercentage": 25
          }
        }

settings:
  encodeUrl: true
