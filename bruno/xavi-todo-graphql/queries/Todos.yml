info:
  name: Todos
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: graphql
    data:
      query: |
        query Todos {
          todos(status: pending, page: 1, limit: 20) {
            todos { id title status priority dueDate subtasksCount { total completed } }
            total
          }
        }

settings:
  encodeUrl: true
