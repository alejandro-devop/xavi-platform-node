info:
  name: RoutineSetActive
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/graphql"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: graphql
    data:
      query: |
        mutation RoutineSetActive($id: ID!) {
          routineSetActive(id: $id) {
            id
            name
            isActive
          }
        }
      variables: |
        { "id": "1" }

settings:
  encodeUrl: true
